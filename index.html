<title>Hyrox Training Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: solid orange app bar with date and title, then white cards on light grey (near black in dark). Strava-style activity cards, Garmin-style metric tiles, MyFitnessPal-style calorie ring and food diary. */
:root{
  --bg:#F3F4EC; --surface:#FFFFFF; --soft:#F6F7EF; --ink:#18241B; --muted:#5E6B60; --line:#E0E4D6;
  --forest:#1F4D2B; --forest2:#2F6B3F; --yellow:#F7C61E; --cream:#F3F1D8;
  --accent:#F28500; --accent-ink:#14301D; --accent-text:#1F4D2B; --accent-soft:#FDF0B8;
  --good:#1F7A3E; --warn:#8A5A12; --bad:#C62828; --bar:#D6DCC8; --shadow:0 1px 2px rgba(20,35,20,.08);
  --font-num:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D160F; --surface:#15221A; --soft:#1D2D21; --ink:#F2F4E6; --muted:#A3B0A0; --line:#2A3C2E;
    --forest:#1F4D2B; --forest2:#2F6B3F; --yellow:#F7C61E; --cream:#F3F1D8;
    --accent:#FF9A1F; --accent-ink:#10200F; --accent-text:#F7C61E; --accent-soft:#3A3410;
    --good:#5FD08A; --warn:#E0A94F; --bad:#FF7A72; --bar:#2F4434; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D160F; --surface:#15221A; --soft:#1D2D21; --ink:#F2F4E6; --muted:#A3B0A0; --line:#2A3C2E;
  --forest:#1F4D2B; --forest2:#2F6B3F; --yellow:#F7C61E; --cream:#F3F1D8;
  --accent:#FF9A1F; --accent-ink:#10200F; --accent-text:#F7C61E; --accent-soft:#3A3410;
  --good:#5FD08A; --warn:#E0A94F; --bad:#FF7A72; --bar:#2F4434; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--font-body); padding-bottom:110px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--forest); z-index:10}
p{margin:0}
.muted{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.appbar{background:var(--forest); color:var(--yellow); border-bottom:4px solid var(--accent)}
.appin{max-width:560px; margin:0 auto; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-top:14px; padding-bottom:16px}
.ab-sub{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; opacity:.85}
.appbar h1{font:700 38px/1 var(--font-num); letter-spacing:.01em; text-transform:uppercase; margin:4px 0 0}
.ab-r{display:grid; justify-items:end; gap:6px; text-align:right}
.status{font-size:12px; opacity:.85}
.appbar .btn{border-color:color-mix(in srgb,var(--yellow) 60%,transparent); color:var(--yellow); background:transparent; min-height:30px; padding:3px 12px; font-size:12px}
.wrap{max-width:560px; margin:0 auto; padding-top:14px; padding-bottom:20px}
.stack{display:grid; gap:12px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
.grid2>*{min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); min-width:0}
h2{font:700 16px/1.2 var(--font-body); margin:0 0 12px}
h3{font:700 22px/1.2 var(--font-body); margin:6px 0 4px}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.eyebrow.acc{color:var(--accent-text)}
.hero2{border-radius:20px; padding:20px 20px 18px; color:var(--yellow); background:linear-gradient(135deg,var(--forest) 0%,var(--forest2) 100%); box-shadow:var(--shadow)}
.hero2 .eyebrow,.hero2 .muted,.hero2 .phase{color:var(--cream); opacity:.92}
.hero2 .big small{color:var(--accent); opacity:1}
.big{font:700 clamp(84px,26vw,112px)/.9 var(--font-num); letter-spacing:.005em; margin:6px 0 10px}
.big small{font:600 24px var(--font-num); letter-spacing:.04em; text-transform:uppercase; margin-left:8px}
.hero2 h3{margin:0 0 2px}
.phase{margin-top:8px; font-size:14px}
.btn{font:600 14px var(--font-body); padding:10px 16px; min-height:42px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.sm{padding:5px 12px; min-height:34px; font-size:13px}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn.danger{color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.good[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn[disabled]{opacity:.35; cursor:default}
.lnk{font:700 13px var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--accent-text); background:none; border:0; padding:10px 0 0; cursor:pointer}
.pill{width:100%; min-height:52px; border-radius:999px; border:0; background:var(--accent); color:var(--accent-ink); font:700 16px var(--font-body); display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; margin-top:16px}
.pill[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.circ{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:transparent; color:var(--muted); display:grid; place-items:center; cursor:pointer; padding:0; flex:none}
.circ[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input,select,textarea{font:16px var(--font-body); color:var(--ink); background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 12px; width:100%; min-height:44px}
textarea{min-height:68px; resize:vertical}
label,.lbl{display:grid; gap:6px; font-size:12px; font-weight:600; color:var(--muted)}
.form{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; align-items:end}
.form .wide{grid-column:1/-1}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent-text); white-space:nowrap; text-transform:lowercase}
.evtag{display:inline-block; margin-left:6px; font-size:12px; font-weight:600; color:var(--accent-text)}
/* activity card (Strava) */
.act{display:flex; gap:12px; align-items:center}
.aicon{width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; flex:none}
.amain{min-width:0}
.at{font:700 18px/1.2 var(--font-body); overflow-wrap:anywhere}
.as{font-size:13px; color:var(--muted); margin-top:2px}
.srow{display:grid; grid-template-columns:repeat(3,1fr); margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
.sc{padding:0 10px; border-left:1px solid var(--line); min-width:0}
.sc:first-child{padding-left:0; border-left:0}
.sc b{display:block; font:700 24px/1.1 var(--font-num); letter-spacing:.01em; overflow-wrap:anywhere}
.sc span{font-size:11px; color:var(--muted); font-weight:600}
.garmin{margin-top:12px; padding:10px 12px; background:var(--accent-soft); border-left:4px solid var(--yellow); border-radius:8px; font-size:13px}
.garmin .eyebrow{color:var(--accent-text); margin-right:6px}
.gymline{margin-top:14px; border-top:1px solid var(--line); padding-top:12px; font-size:14px}
/* tiles (Garmin) */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow); min-width:0}
.tv{font:700 44px/1 var(--font-num); letter-spacing:.005em; margin-top:8px; color:var(--ink)}
.tv small{font:600 16px var(--font-num); letter-spacing:.04em; color:var(--muted); margin-left:5px; text-transform:uppercase}
.ts{font-size:12px; color:var(--muted); margin-top:6px}
.segs{display:flex; gap:4px; margin-top:12px}
.segs i{flex:1; height:8px; border-radius:4px; background:var(--line)}
.segs i.pl{background:var(--bar)}
.segs i.on{background:var(--accent)}
.segs i.off{opacity:.35}
/* calories (MyFitnessPal) */
.calrow{display:flex; align-items:center; gap:18px}
.ring{width:132px; height:132px; flex:none}
.rtrack{fill:none; stroke:var(--line); stroke-width:10}
.rprog{fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round}
.rprog.over{stroke:var(--bad)}
.rnum{font:700 32px var(--font-num); fill:var(--ink)}
.rlab{font:600 10px var(--font-body); fill:var(--muted)}
.eq{display:grid; gap:10px; flex:1; min-width:0}
.eq div{display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid var(--line); padding-bottom:8px}
.eq div:last-child{border-bottom:0; padding-bottom:0}
.eq b{font:700 28px/1 var(--font-num)}
.eq span{font-size:13px; color:var(--muted); font-weight:600}
.mbs{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px}
.mbs.one{grid-template-columns:1fr; margin-top:12px}
.mbh{display:flex; justify-content:space-between; gap:6px; font-size:12px; font-weight:600; margin-bottom:6px; flex-wrap:wrap}
.mbh span:first-child{color:var(--muted)}
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.bar.over i{background:var(--bad)}
.dsec{padding:12px 0; border-top:1px solid var(--line)}
.dsec:first-of-type{border-top:0; padding-top:0}
.dh{display:flex; justify-content:space-between; align-items:baseline}
.dh b{font-size:16px}
.dh span{font:700 18px var(--font-num); color:var(--muted)}
.item{display:grid; grid-template-columns:1fr auto 32px; gap:10px; align-items:center; padding:9px 0 9px 0; border-top:1px solid var(--line); margin-top:8px}
.item .in{font-size:15px; overflow-wrap:anywhere}
.item .isub{font-size:12px; color:var(--muted)}
.item .ik{font:700 18px var(--font-num)}
.x{width:32px; height:32px; border-radius:50%; border:0; background:transparent; color:var(--muted); font-size:20px; cursor:pointer; line-height:1}
.dots{display:flex; justify-content:space-between; margin:14px 0 0}
.dot{display:grid; justify-items:center; gap:8px; font-size:11px; color:var(--muted); font-weight:600}
.dot i{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:block}
.dot.done i{background:var(--accent); border-color:var(--accent)}
.dot.today i{box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink)}
.dot.today span{color:var(--ink)}
.dot.rest i{opacity:.5}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:10px; margin-bottom:14px}
.stat{background:var(--soft); border-radius:12px; padding:12px}
.stat b{display:block; font:700 32px/1.05 var(--font-num); letter-spacing:.005em}
.stat span{font-size:11px; color:var(--muted); font-weight:600}
.row{display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{min-width:0}
.row .grow{flex:1}
/* plan days (Garmin calendar) */
.dcard{display:grid; grid-template-columns:48px 1fr auto; gap:12px; align-items:start; padding:14px 0; border-top:1px solid var(--line)}
.dcard.editing{display:block}
.dn{display:grid; justify-items:center; gap:4px}
.dn small{font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--muted)}
.dn b{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font:700 20px var(--font-num)}
.dcard.today .dn b{background:var(--accent); color:var(--accent-ink)}
.dcard .body{min-width:0}
.dcard .top2{display:flex; gap:4px 10px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap}
.dcard .top2 b{font-weight:700; font-size:16px}
.dcard p{margin-top:2px; font-size:14px; color:var(--muted)}
.dcard .acts{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px}
.weeknav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.weeknav>div{text-align:center}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.scroll{overflow-x:auto}
svg.chart{width:100%; height:auto; display:block}
.ax{fill:var(--muted); font:10px var(--font-body)}
.axv{fill:var(--ink); font:700 10px var(--font-body)}
.gridl{stroke:var(--line); stroke-width:1}
.avg{stroke:var(--accent); stroke-width:2.5; fill:none; stroke-linejoin:round; stroke-linecap:round}
.area{fill:var(--accent-soft); opacity:.9}
.pt{fill:var(--accent); opacity:.55}
.endpt{fill:var(--surface); stroke:var(--accent); stroke-width:2.5}
.goal{stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none}
.goalt{fill:var(--muted); font:600 10px var(--font-body)}
.bar-d{fill:var(--bar)}
.bar-s{fill:var(--accent)}
.tgt{stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4}
details summary{cursor:pointer; font-weight:600; font-size:14px}
details[open] summary{margin-bottom:8px}
.stations{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; padding:0; margin:10px 0; list-style:none; counter-reset:s}
.stations li{counter-increment:s; display:flex; gap:10px; align-items:baseline; font-size:14px}
.stations li::before{content:counter(s); font:700 20px var(--font-num); color:var(--accent-text); width:14px; flex:none}
.past{opacity:.55}
.empty{padding:14px 0; color:var(--muted); font-size:14px}
.note{font-size:12px; color:var(--muted)}
.err{font-size:13px; color:var(--bad); margin-top:8px}
.ok{font-size:13px; color:var(--good); margin-top:8px; font-weight:600}
.bubble{border-radius:18px; padding:10px 14px; font-size:14px; min-width:0; overflow-wrap:anywhere}
.bubble.u{background:var(--accent); color:var(--accent-ink); justify-self:end; max-width:92%}
.bubble.c{background:var(--soft)}
.bubble p+p,.bubble ul+p,.bubble p+ul{margin-top:8px}
.bubble ul{margin:0; padding-left:18px}
.split{display:grid; grid-template-columns:1fr 96px; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.split:first-of-type{border-top:0}
.aiitem{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)) auto; gap:8px; align-items:end; padding:12px 0; border-top:1px solid var(--line)}
.aiitem:first-of-type{border-top:0}
.aiitem input{padding:10px 6px; text-align:center}
.aiitem label:first-child{grid-column:1/-1}
.aiitem label:first-child input{text-align:left; padding:10px 12px}
#nav{position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:560px; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  padding:4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px))}
#nav .in{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
#nav button{display:grid; justify-items:center; align-content:center; gap:3px; font:600 10.5px var(--font-body); color:var(--muted); background:none; border:0; padding:8px 0; cursor:pointer; min-height:56px}
#nav button[aria-current="page"]{color:var(--accent-text)}
@media (min-width:620px){ #nav{border:1px solid var(--line); border-bottom:0; border-radius:20px 20px 0 0} }
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .3s ease} }

.gex .exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gsets{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin-top:10px}
.gsets .sn{font-weight:700;color:var(--muted);text-align:center}
.gsets .gh{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;letter-spacing:.04em}
.gsets input{min-height:42px;text-align:center;padding:8px}
.gex.ed{border-top:1px solid var(--line);padding:14px 0}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wg .wt{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--accent-text)}
.wg input{padding:8px 10px;min-height:40px;font-size:15px}
.gtot{display:flex;justify-content:space-between;align-items:baseline}
.chip{border:1px solid color-mix(in srgb,var(--yellow) 70%,transparent)}
.dcard.today{border-color:var(--yellow); box-shadow:0 0 0 1px var(--yellow)}
.endpt{stroke:var(--forest)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .endpt{stroke:var(--yellow)}}
:root[data-theme="dark"] .endpt{stroke:var(--yellow)}
.goal{stroke:var(--accent); stroke-width:1.5}
.goalt{fill:var(--accent-text)}
#nav button[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent)}
.cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.cmp{border-collapse:collapse;width:100%;font-size:13px}
table.cmp th,table.cmp td{padding:9px 8px;text-align:center;border-top:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.cmp thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700}
table.cmp thead th small{display:block;font-weight:500;font-size:11px}
table.cmp th[scope=row]{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface);min-width:118px;max-width:150px;white-space:normal}
table.cmp thead th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.cmp td b{font-weight:700}
table.cmp td i{font-style:normal;margin-left:5px;font-size:11px}
table.cmp .up{color:var(--good)} table.cmp .dn{color:var(--bad)} table.cmp .eq{color:var(--muted)}
table.cmp .none{color:var(--muted)}
table.cmp tr.tot td,table.cmp tr.tot th{border-top:2px solid var(--line)}
.fold{padding:0}
.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;font:700 16px/1.2 var(--font-body);cursor:pointer;min-height:52px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-right:4px;flex:none}
.fold[open]>summary::after{transform:rotate(-135deg)}
.fold[open]>summary{margin-bottom:0}
.fold>.fbody{padding:0 16px 16px}
</style>

<script>

async function flush(){

  saving=true; failed=false;
  const p={core:pending.core||!persisted,months:new Set(pending.months),gm:new Set(pending.gm),all:!persisted};
  pending.core=false; pending.months.clear(); pending.gm.clear();
  try{
    if(mode==='cloud'&&col){
      if(p.all)S.meals.forEach(m=>p.months.add(m.date.slice(0,7)));
      if(p.all)Object.keys(S.glogs).forEach(d=>p.gm.add(d.slice(0,7)));
      if(p.core)await col.doc('core').set({state:coreOf(S)});
      for(const mk of p.months){await col.doc('m-'+mk).set({items:S.meals.filter(m=>m.date.slice(0,7)===mk)});}
      for(const mk of p.gm){const it={};Object.keys(S.glogs).filter(x=>x.slice(0,7)===mk).forEach(x=>{it[x]=S.glogs[x];});await col.doc('g-'+mk).set({items:it});}
    }else{

}
function applyLoaded(core,meals,glogs){

    const months={}; meals.forEach(m=>{months[m.date.slice(0,7)]=1;});

    else{S.events=S.events.filter(e=>!/example/i.test(e.name));if(!S.events.some(isKL))S.events.push(klEvent());}

function loadFrom(docs){

    else if(d.id.indexOf('m-')===0)meals=meals.concat(data.items||[]);

async function initStore(){

  try{

        const c=db.collection('data/users/'+id);

          try{snap=await Promise.race([c.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);break;}

function niceTicks(min,max,n){
  const span=(max-min)||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=5?5:10)*mag, out=[];
  for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)out.push(+v.toFixed(6));
  return {ticks:out,step:step};
}
function weightChart(){

  const avg=pts.map(p=>{const lo=addDays(p.date,-6),g=all.filter(w=>w.date>=lo&&w.date<=p.date);return {date:p.date,kg:sum(g,'kg')/g.length};});
  let vals=pts.map(p=>p.kg), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);

  const line=avg.map((a,i)=>(i?'L':'M')+xs(a.date).toFixed(1)+' '+ys(a.kg).toFixed(1)).join(' ');

    ${g}<path class="area" d="${area}"/>${goalSvg}${dots}<path class="avg" d="${line}"/>
    <circle class="endpt" cx="${xs(last.date).toFixed(1)}" cy="${ys(last.kg).toFixed(1)}" r="4.5"/>

    <text class="ax" x="${((L+W-R)/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${fmt(mid)}</text>

function barChart(vals,labels,target,selIdx,label){
  const W=360,H=140,L=8,R=8,T=16,B=22;
  const max=Math.max.apply(null,[target*1.2].concat(vals))*1.08, bw=(W-L-R)/vals.length;

  let s='';
  vals.forEach((v,i)=>{
    const x=L+i*bw+bw*0.18, w=bw*0.64, y=ys(v);
    s+=`<rect class="${i===selIdx?'bar-s':'bar-d'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,H-B-y).toFixed(1)}" rx="2"/>`;
    if(v>0)s+=`<text class="${i===selIdx?'axv':'ax'}" x="${(x+w/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle">${Math.round(v)}</text>`;
    s+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line class="tgt" x1="${L}" x2="${W-R}" y1="${ys(target).toFixed(1)}" y2="${ys(target).toFixed(1)}"/>${s}</svg>`;
}
function spark(vals){
  if(vals.length<2)return '';
  const W=120,H=36,p=4, lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
  const pts=vals.map((v,i)=>[p+i*(W-2*p)/(vals.length-1),p+(1-(v-lo)/span)*(H-2*p)]);

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline class="sp" points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/><circle class="endpt" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3.5"/></svg>`;

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=c;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function importActs(text,unit){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));
  if(rows.length<2)throw new Error('format');
  const hd=rows[0].map(h=>String(h).replace(/^﻿/,'').trim().toLowerCase());
  const ix=names=>{for(const n of names){const i=hd.indexOf(n);if(i>=0)return i;}return -1;};
  const iT=ix(['activity type']),iD=ix(['date']),iTi=ix(['title']),iDi=ix(['distance']),iTm=ix(['time','elapsed time']),iHr=ix(['avg hr','average hr']),iKc=ix(['calories']);
  if(iD<0||iT<0)throw new Error('format');
  const f=unit==='mi'?1.609344:1, have=new Set(S.acts.map(a=>a.k));
  let added=0,seen=0,marked=0;
  rows.slice(1).forEach(r=>{
    const dt=String(r[iD]||'').trim(), m=/^(\d{4}-\d{2}-\d{2})/.exec(dt); if(!m)return;
    seen++;
    const ty=String(r[iT]||'Activity').trim(), k=dt+'|'+ty; if(have.has(k))return; have.add(k);
    const km=iDi>=0?nm(r[iDi]):null;
    S.acts.push({k:k,d:m[1],ty:ty.slice(0,40),ti:iTi>=0?String(r[iTi]||'').slice(0,60):'',km:km!=null&&km>0?Math.round(km*f*100)/100:null,sec:iTm>=0?hms(r[iTm]):null,hr:iHr>=0?nm(r[iHr]):null,kc:iKc>=0?nm(r[iKc]):null});
    added++;
  });
  S.acts.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0); S.acts=S.acts.slice(0,400);
  const t=todayStr(), lo=addDays(t,-120), days={};
  S.acts.forEach(a=>{days[a.d]=1;});
  Object.keys(days).forEach(d=>{if(d<=t&&d>=lo&&!S.done[d]&&typeOf(getEntry(d))!=='rest'){S.done[d]=true;marked++;}});
  return {added:added,seen:seen,marked:marked};
}
async function importFile(f){

/* ---------- gym program (GYM_2026) ---------- */
const lst=s=>String(s==null?'':s).split(',').map(x=>x.trim()).filter(Boolean);
const tgtAt=(s,i)=>{const a=lst(s);return a.length?(a[i]!==undefined?a[i]:a[a.length-1]):'';};
const tgtNum=(s,i)=>num(String(tgtAt(s,i)).replace(/\(.*$/,''));
const gSetCount=w=>{const n=num(w&&w.s);return n&&n>0?Math.min(Math.round(n),12):Math.min(12,Math.max(lst(w&&w.r).length,lst(w&&w.l).length,3));};
function defGym(){const g=JSON.parse(JSON.stringify(G26));return {on:true,start:'2026-12-14',days:g.sessions.map((s,i)=>i),sessions:g.sessions.map(s=>({id:s.id,name:s.name,ex:s.ex.filter(x=>!/^Unnamed exercise/i.test(x.name))})),weekNames:g.weekNames};}
const gWeekAt=d=>d<S.gym.start?0:Math.floor(diffDays(d,S.gym.start)/7)%4;
function gSchedule(d){
  const g=S.gym; if(!g.on||d<g.start)return null;
  const di=g.days.indexOf(dow(d)); if(di<0||!g.sessions[di])return null;
  return {si:di,wk:gWeekAt(d)};
}
function gymEntry(d){
  const g=S.gym, sc=gSchedule(d), ev=S.events.find(isKL);
  if(sc){const s=g.sessions[sc.si];
    return {src:'gym',type:'strength',focus:'Strength',workout:s.name,detail:'Cycle week '+(sc.wk+1)+', '+(g.weekNames[sc.wk]||'').toLowerCase()+'. '+s.ex.length+' exercises. Open the workout to log your sets.',rpe:'',dur:'60–75 min',gym:'',week:0,phase:'',gsi:sc.si,gwk:sc.wk};}
  if(g.on&&ev&&d>ev.date&&d<g.start&&diffDays(d,ev.date)<=3)
    return {src:'gym',type:'recovery',focus:'Recovery',workout:'Post-race recovery',detail:'Walk, mobility, eat well and sleep. The gym program starts on '+fmt(g.start,{weekday:'long',day:'numeric',month:'short'})+'.',rpe:'',dur:'',gym:'',week:0,phase:''};
  return null;
}
const gVolOf=e=>(e.s||[]).reduce((a,x)=>a+((x[0]!=null&&x[1]!=null)?x[0]*x[1]:0),0);
function gVolLog(lg,s){if(!lg||!s)return 0;return s.ex.reduce((a,x)=>a+(lg.ex[x.id]?gVolOf(lg.ex[x.id]):0),0);}
function gSetsDone(lg){let n=0;Object.keys(lg.ex||{}).forEach(k=>(lg.ex[k].s||[]).forEach(x=>{if(x[1]!=null&&x[1]>0)n++;}));return n;}
function gLogLine(d){
  const lg=S.glogs[d]; if(!lg)return '';
  let v=0;Object.keys(lg.ex).forEach(k=>{v+=gVolOf(lg.ex[k]);});
  return `<p class="note" style="margin-top:6px">Gym logged: ${gSetsDone(lg)} sets, ${Math.round(v)} kg volume</p>`;
}
function gLast(name,d){
  const k=String(name).toLowerCase(), ds=Object.keys(S.glogs).filter(x=>x<d).sort().reverse();
  for(const x of ds){
    const e=Object.keys(S.glogs[x].ex).map(i=>S.glogs[x].ex[i]).find(y=>String(y.n).toLowerCase()===k);
    if(e){const ss=e.s.filter(q=>q[1]>0); if(ss.length)return fmt(x)+': '+ss.map(q=>(q[0]!=null?q[0]:'bw')+'×'+q[1]).join(', ');}
  }
  return '';
}
function gCtx(){
  const G=S.gym,g=ui.g,d=g.date,sc=gSchedule(d),lg=S.glogs[d];
  let si=g.si!=null?g.si:-1;
  if(si<0&&lg)si=G.sessions.findIndex(x=>x.id===lg.sid);
  if(si<0)si=sc?sc.si:0;
  si=Math.max(0,Math.min(si,G.sessions.length-1));
  const wk=g.wk!=null?g.wk:(lg&&lg.wk!=null?lg.wk:(sc?sc.wk:gWeekAt(d)));
  return {d:d,si:si,wk:wk,s:G.sessions[si],sc:sc,lg:lg};
}
function gFind(id){for(const s of S.gym.sessions){const x=s.ex.find(y=>y.id===id);if(x)return x;}return null;}
function gAfter(d){
  const lg=S.glogs[d];
  if(lg){
    Object.keys(lg.ex).forEach(id=>{if(!lg.ex[id].s.some(x=>x[0]!=null||x[1]!=null))delete lg.ex[id];});
    if(!Object.keys(lg.ex).length)delete S.glogs[d];
    else if(gSetsDone(lg)&&typeOf(getEntry(d))!=='rest')S.done[d]=true;
  }
  touch({core:true,gm:[d.slice(0,7)]});
}

    <div class="form"><label>Session<select data-change="gSes">${G.sessions.map((x,i)=>`<option value="${i}"${i===c.si?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
    <label>Cycle week<select data-change="gWk">${[0,1,2,3].map(i=>`<option value="${i}"${i===c.wk?' selected':''}>Week ${i+1}, ${esc(G.weekNames[i]||'')}</option>`).join('')}</select></label></div></section>`;
  const exs=s.ex.map(x=>{
    const w=x.w[c.wk]||{}, n=gSetCount(w), e=lg&&lg.ex[x.id], last=gLast(x.name,d);
    let rows='<span></span><span class="gh">kg</span><span class="gh">reps</span>';
    for(let i=0;i<n;i++){
      const v=(e&&e.s[i])||[null,null], pl=tgtNum(w.l,i), pr=tgtNum(w.r,i);
      rows+=`<span class="sn">${i+1}</span>
        <input type="number" inputmode="decimal" step="any" min="0" data-gl="${esc(x.id)}" data-i="${i}" data-f="l" placeholder="${pl==null?'':pl}" value="${v[0]==null?'':v[0]}" aria-label="${esc(x.name)} set ${i+1} kg">
        <input type="number" inputmode="decimal" step="any" min="0" data-gl="${esc(x.id)}" data-i="${i}" data-f="r" placeholder="${pr==null?'':pr}" value="${v[1]==null?'':v[1]}" aria-label="${esc(x.name)} set ${i+1} reps">`;
    }
    const tg=[w.s?w.s+' sets':'',w.r?'reps '+w.r:'',w.l?'load '+w.l:'',w.q?'RIR '+w.q:''].filter(Boolean).join(' · ');
    return `<section class="card gex"><div class="exh"><b>${esc(x.name)}</b></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}
      <div class="note">${esc(tg||'No target set for this week. Edit it in the Program tab.')}</div>${last?`<div class="note">Last time, ${esc(last)}</div>`:''}
      <div class="gsets">${rows}</div></section>`;
  }).join('');
  const done=!!S.done[d];
  const foot=`<section class="card"><div class="gtot"><span class="muted">Volume this session</span><b class="tn"><span id="gvol">${Math.round(gVolLog(lg,s))}</span> kg</b></div>
    <div class="actions" style="margin-top:12px"><button class="btn" data-a="g:fill">Fill empty sets with targets</button><button class="btn" aria-pressed="${done}" data-a="g:done">${done?'Marked done':'Mark day done'}</button>${lg?'<button class="btn ghost danger" data-a="g:clear">Clear day log</button>':''}</div>

function gProgram(){
  const G=S.gym,g=ui.g, ed=Math.max(0,Math.min(g.edit,G.sessions.length-1)), s=G.sessions[ed], cf=k=>g.confirm===k;
  const setc=`<section class="card"><h2>Schedule</h2><div class="form">
    <label>Program<select data-change="gpOn"><option value="1"${G.on?' selected':''}>On</option><option value="0"${G.on?'':' selected'}>Off</option></select></label>
    <label>Start date<input type="date" data-change="gpStart" value="${esc(G.start)}"></label></div>
    <div class="eyebrow" style="margin:14px 0 6px">Weekday for each session</div>`+

function gAgg(){

    }

    case 'openPerms':{(async()=>{let ps='';try{const P=window.claude&&await window.claude.use('permissions');if(P)await P.manage();else ps='Permissions panel not available here.';}catch(e){ps='Could not open the permissions panel ('+((e&&(e.code||e.message))||'unknown')+').';}await initStore();ui.syncMsg=ps||(mode==='cloud'?'Connected.':'Still not syncing. '+syncWhy+'.');render();})();return;}
    case 'delScan':S.body=S.body.filter(b=>b.date!==v);touch({core:true});break;
    case 'useTw':S.targets.goalKg=+v;touch({core:true});break;
    case 'delMeal':{const m=S.meals.find(x=>x.id===v);S.meals=S.meals.filter(x=>x.id!==v);if(m)touch({months:[m.date.slice(0,7)]});break;}
    case 'delEvent':S.events=S.events.filter(x=>x.id!==v);touch({core:true});break;
    case 'mealPrev':ui.mealDate=addDays(ui.mealDate,-1);ui.draft=null;break;
    case 'mealNext':if(ui.mealDate<t){ui.mealDate=addDays(ui.mealDate,1);ui.draft=null;}break;
    case 'prefill':{const m=recentFoods()[+v];if(m)ui.draft={slot:m.slot,name:m.name,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,sugar:m.sugar};break;}
    case 'aiEstimate':{const ta=$('#aiText');if(ta)ui.aiMeal.text=ta.value;estimateMeal();return;}
    case 'aiStop':case 'coachStop':case 'planStop':if(ui.ctl)ui.ctl.abort();return;
    case 'aiNoFile':ui.aiMeal.file=null;break;
    case 'aiDrop':ui.aiMeal.items.splice(+v,1);break;
    case 'aiDiscard':ui.aiMeal.items=null;ui.aiMeal.text='';ui.aiMeal.file=null;break;
    case 'aiAdd':{
      const a2=ui.aiMeal; if(!a2.items||!a2.items.length)return;
      a2.items.forEach(x=>{S.meals.push({id:uid(),date:ui.mealDate,slot:a2.slot,name:String(x.name||'Food').trim()||'Food',kcal:Math.round(+x.kcal||0),protein:Math.round(+x.protein||0),carbs:Math.round(+x.carbs||0),fat:Math.round(+x.fat||0),sugar:Math.round(+x.sugar||0)});});
      touch({months:[ui.mealDate.slice(0,7)]}); ui.aiMeal.items=null;ui.aiMeal.text='';ui.aiMeal.file=null; break;}
    case 'coachQuick':{const q=['How should I train today given my sleep and soreness?','Review my week and what to change next week','Am I hitting protein? Suggest meals for the rest of today','How do I combine Hyrox, half Ironman and a lean physique in 2027?'][+v];askCoach(q);return;}
    case 'coachClear':ui.coach.turns=[];ui.coach.error='';break;
    case 'planDiscard':ui.plan.result=null;break;
    case 'planAdd':{
      const r=ui.plan.result; if(!r)return;
      r.days.forEach(x=>{if(x.date>=t)S.extra[x.date]={focus:x.focus,workout:x.workout,detail:x.detail,rpe:x.rpe,dur:x.dur,gym:x.gym};});
      touch({core:true}); ui.plan.result=null; ui.tab='plan'; ui.weekOff=Math.max(0,Math.floor(diffDays(weekStart(r.days[0].date),weekStart(t))/7)); break;}
    default:return;
  }
  render();
});
document.addEventListener('change',function(e){
  const el=e.target, ds=el.dataset||{}, t=todayStr();
  if(ds.ai){const it=ui.aiMeal.items&&ui.aiMeal.items[+ds.i];if(it){it[ds.ai]=ds.ai==='name'?el.value:Math.max(0,num(el.value)||0);}return;}
  if(gChange(el,ds))return;
  const k=ds.change; if(!k)return;
  if(k==='sleep'||k==='energy'||k==='soreness'){
    const v=num(el.value), c=S.checkins[t]||(S.checkins[t]={});
    const max=k==='sleep'?14:10, min=k==='sleep'?0:1;
    if(v===null||v<min||v>max)delete c[k];else c[k]=v;
    touch({core:true});render();
  }else if(k==='evNote'){
    const ev=S.events.find(x=>x.id===ds.id); if(ev){ev.note=el.value.slice(0,800);touch({core:true});}
  }else if(k==='result'){
    const v=el.value.trim().slice(0,200); if(v)S.results[t]=v;else delete S.results[t]; touch({core:true});
  }else if(k==='goals'){
    S.goals=el.value.slice(0,1500); touch({core:true});
  }else if(k==='aiText'){ui.aiMeal.text=el.value;}
  else if(k==='impUnit'){ui.imp.unit=el.value;}
  else if(k==='importData'){const f=el.files&&el.files[0];if(f)f.text().then(txt=>{try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||!o.v)throw new Error('bad');applyLoaded(o,Array.isArray(o.meals)?o.meals:[]);ui.bk='Backup restored.';touch({core:true});}catch(e){ui.bk='That file is not a valid backup.';}render();});}
  else if(k==='scanFile'){const f=el.files&&el.files[0];if(f)readScan(f);}
  else if(k==='actFile'){const f=el.files&&el.files[0];if(f)importFile(f);}
  else if(k==='aiSlot'){ui.aiMeal.slot=el.value;}
  else if(k==='aiFile'){const ta=$('#aiText');if(ta)ui.aiMeal.text=ta.value;ui.aiMeal.file=el.files&&el.files[0]||null;render();}
});
document.addEventListener('submit',function(e){
  const f=e.target.closest('[data-form]'); if(!f)return;
  e.preventDefault();
  const k=f.dataset.form, d=new FormData(f), t=todayStr();
  if(k==='coach'){const q=$('#coachIn').value;askCoach(q);return;}
  if(k==='draft'){
    const start=String(d.get('start')||''); if(!isDate(start))return;
    draftPlan(start<t?t:start,Math.max(1,Math.min(4,+d.get('weeks')||2)),String(d.get('notes')||'').trim());return;
  }
  if(k==='weight'){
    const date=d.get('date'), kg=num(d.get('kg')); if(!date||kg===null||kg<20||kg>300)return;
    S.weights=S.weights.filter(w=>w.date!==date); S.weights.push({date:date,kg:Math.round(kg*10)/10}); touch({core:true});
  }else if(k==='strava'){
    const u=String(d.get('url')||'').trim(); ui.imp.msg=''; ui.imp.err='';
    if(!/^https?:\/\/([a-z0-9-]+\.)*(strava\.com|strava\.app\.link)\//i.test(u))ui.imp.err='That does not look like a Strava link. It should start with https://www.strava.com/ or https://strava.app.link/.';
    else if(S.strava.some(x=>x.url===u))ui.imp.err='That link is already saved.';
    else{S.strava.push({id:uid(),url:u.slice(0,300),d:todayStr()});ui.imp.msg='Link saved. Now message Claude: read my Strava links.';touch({core:true});}
  }else if(k==='act'){
    const date=String(d.get('date')||''); if(!isDate(date))return;
    const ty=String(d.get('ty')||'Other'), km=num(d.get('km')), sec=hms(String(d.get('time')||'').trim()), hr=num(d.get('hr'));
    S.acts.push({k:date+'|'+ty+'|m'+uid(),d:date,ty:ty,ti:'',km:km!=null&&km>0?Math.round(km*100)/100:null,sec:sec,hr:hr,kc:null});
    S.acts.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0); S.acts=S.acts.slice(0,400);
    if(date<=t&&typeOf(getEntry(date))!=='rest')S.done[date]=true;
    ui.imp.msg='Activity added.'; ui.imp.err=''; touch({core:true});
  }else if(k==='scan'){
    const date=String(d.get('date')||''); if(!isDate(date))return;
    const o={date:date}; let ok=true;
    BF.forEach(f=>{const v=num(d.get(f[0]));if(v!==null&&v>=f[3]&&v<=f[4])o[f[0]]=v;else if(f[0]==='kg'||f[0]==='pbf'||f[0]==='smm')ok=false;});
    if(!ok)return;
    S.body=S.body.filter(b=>b.date!==date); S.body.push(o);
    S.weights=S.weights.filter(w=>w.date!==date); S.weights.push({date:date,kg:Math.round(o.kg*10)/10});
    touch({core:true});
  }else if(k==='goal'){
    const g=num(d.get('goal')); S.targets.goalKg=(g!==null&&g>=20&&g<=300)?g:null; const gf=num(d.get('goalFat')); S.targets.goalFat=(gf!==null&&gf>=3&&gf<=60)?gf:null; touch({core:true});
  }else if(k==='meal'){
    const kcal=num(d.get('kcal')); if(kcal===null||kcal<0)return;
    const slot=String(d.get('slot')||'Snack'), name=String(d.get('name')||'').trim()||slot;
    S.meals.push({id:uid(),date:ui.mealDate,slot:slot,name:name,kcal:Math.round(kcal),protein:Math.round(num(d.get('protein'))||0),carbs:gOrNull(d.get('carbs')),fat:gOrNull(d.get('fat')),sugar:gOrNull(d.get('sugar'))});
    ui.draft=null; touch({months:[ui.mealDate.slice(0,7)]});
  }else if(k==='targets'){
    const kc=num(d.get('kcal')), pr=num(d.get('protein')); if(kc===null||pr===null)return;
    S.targets.kcal=Math.round(kc); S.targets.protein=Math.round(pr); S.targets.carbs=gOrNull(d.get('carbs')); S.targets.fat=gOrNull(d.get('fat')); S.targets.sugar=gOrNull(d.get('sugar')); touch({core:true});
  }else if(k==='event'){
    const name=String(d.get('name')||'').trim(), date=d.get('date'); if(!name||!date)return;
    S.events.push({id:uid(),name:name,date:date,type:String(d.get('type')||'Other'),note:String(d.get('note')||'').trim().slice(0,800)}); touch({core:true});
  }else if(k==='splits'){
    DATA.splits.forEach((s,i)=>{const v=String(d.get('s'+i)||'').trim(),sec=toSec(v);if(sec===null)delete S.splits[s[0]];else S.splits[s[0]]=fmtSec(sec).replace(/^(\d):/,'0$1:');});
    touch({core:true});
  }else if(k==='planDay'){
    const i=+f.dataset.i, type=String(d.get('type')); if(!TYPES[type])return;
    S.plan[i]={type:type,title:String(d.get('title')||'').trim()||TYPES[type],notes:String(d.get('notes')||'').trim()};
    ui.editDay=null; touch({core:true});
  }
  render();
});
